# Proxyman trust overlay for the dev loop — OPT-IN, layer on top of
# docker-compose-all.yml (or docker-compose-no-frontend.yml). The launchers add it
# automatically when build/config/proxyman-ca-bundle.pem is present.
#
#   1. In Proxyman: Certificate > Install Certificate on this Mac (once).
#   2. pwsh build/tools/Export-ProxymanCert.ps1   # -> build/config/proxyman-ca-bundle.pem
#   3. build/tools/Start-CippDev.sh               # (auto-detects the bundle)
#
# Why this is trust-ONLY (no HTTP_PROXY / extra_hosts): we proxy at the SYSTEM level.
# macOS's system proxy points at Proxyman (127.0.0.1:9090) and Docker Desktop routes
# every container's traffic through it — so outbound HTTPS already reaches Proxyman.
# The only thing the container lacks is trust in Proxyman's re-signing CA.
#
# The cipp-api container runs the distroless Craft image (no shell, no update-ca-trust),
# so we can't extract a cert at runtime. Instead we bind-mount a bundle straight OVER
# the image's OpenSSL root store. Because that replaces the file, the bundle produced
# by Export-ProxymanCert.ps1 is the image's own 217 roots PLUS Proxyman — mounting the
# Proxyman cert alone here would make every non-intercepted host fail to validate.
services:
  cipp-api:
    volumes:
      - ./config/proxyman-ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro
